<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick your package | Live Nation internal checker</title>
<style>
  :root {
    --red: #E3262B;
    --red-dark: #A31D23;
    --black: #000000;
    --ink: #1A1A1A;
    --grey-700: #4D4D4D;
    --grey-500: #8C8C8C;
    --grey-200: #D9D9D9;
    --grey-100: #F2F2F2;
    --pink: #FFE0E4;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", "HelveticaNeue", "Helvetica Neue LT Std", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--white);
    line-height: 1.45;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

  /* top bar */
  .bar {
    background: var(--black);
    color: var(--white);
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px;
  }
  .logo { display: block; height: 26px; width: auto; }
  .internal {
    font-size: 13px; font-weight: 600;
    border: 1.5px solid var(--red); color: var(--white);
    padding: 4px 14px; border-radius: 999px;
  }

  .wrap { max-width: 1060px; margin: 0 auto; padding: 36px 32px 64px; }
  h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1.02; letter-spacing: -.02em; margin: 0 0 8px; font-weight: 500; }
  .lede { margin: 0 0 32px; color: var(--grey-700); font-size: 18px; max-width: 60ch; }

  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 40px; align-items: start; }

  /* ---------- flow rail ---------- */
  .rail { list-style: none; margin: 0; padding: 0; position: relative; }
  .node { position: relative; display: grid; grid-template-columns: 34px 1fr; column-gap: 14px; padding-bottom: 28px; }
  .node:last-child { padding-bottom: 0; }
  .node::before { /* connector */
    content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--grey-200);
  }
  .node:last-child::before { display: none; }
  .node.passed::before { background: var(--red); }
  .dot {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    border: 2px solid var(--grey-200); background: var(--white);
    font-weight: 800; font-size: 15px; color: var(--grey-500);
    transition: background-color .2s, border-color .2s, color .2s;
  }
  .node.current .dot { border-color: var(--red); color: var(--red); box-shadow: 0 0 0 4px var(--pink); }
  .node.yes .dot { background: var(--red); border-color: var(--red); color: var(--white); }
  .node.no .dot { background: var(--grey-700); border-color: var(--grey-700); color: var(--white); }
  .node.skipped { opacity: .45; }
  .node.result-premium .dot { background: var(--red); border-color: var(--red); color: var(--white); }
  .node.result-standard .dot { background: var(--black); border-color: var(--black); color: var(--white); }
  .node-body { min-height: 34px; display: flex; flex-direction: column; justify-content: center; }
  .node-btn {
    all: unset; cursor: pointer; display: block; font-weight: 700; font-size: 16px; line-height: 1.2;
  }
  .node-btn:disabled { cursor: default; }
  .node-btn:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  .node-sub { font-size: 14px; color: var(--grey-700); margin-top: 2px; }
  .branch {
    margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--grey-500);
    border: 1.5px dashed var(--grey-200); border-radius: 6px; padding: 2px 8px; width: fit-content;
  }
  .node.no .branch { color: var(--white); background: var(--black); border: 1.5px solid var(--black); }

  /* ---------- main panel ---------- */
  .panel { min-height: 420px; }
  .step-meta { font-size: 15px; font-weight: 600; color: var(--red); margin: 0 0 10px; }
  .q { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; letter-spacing: -.015em; font-weight: 500; margin: 0 0 12px; max-width: 22ch; }
  .help { color: var(--grey-700); font-size: 17px; margin: 0 0 24px; max-width: 56ch; }

  .answers { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  .btn {
    cursor: pointer; border-radius: 10px; padding: 16px 40px; font-size: 20px; font-weight: 800;
    border: 2px solid var(--black); background: var(--white); color: var(--black);
    transition: background-color .15s, color .15s, transform .1s;
  }
  .btn:hover { background: var(--black); color: var(--white); }
  .btn:active { transform: translateY(1px); }
  .btn.yes { background: var(--red); border-color: var(--red); color: var(--white); }
  .btn.yes:hover { background: var(--red-dark); border-color: var(--red-dark); }
  .btn.ghost { border-color: var(--grey-200); color: var(--grey-700); font-size: 16px; font-weight: 600; padding: 10px 20px; }
  .btn.ghost:hover { background: var(--grey-100); color: var(--black); }
  .back-row { margin-top: 28px; }

  /* calculator */
  .calc { background: var(--grey-100); border-radius: 12px; padding: 18px 20px; margin: 0 0 24px; max-width: 560px; }
  .calc h3 { margin: 0 0 4px; font-size: 16px; }
  .calc p.note { margin: 0 0 14px; font-size: 14px; color: var(--grey-700); }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--grey-200); border-radius: 8px; background: var(--white); font-size: 16px;
  }
  .calc-out { margin-top: 14px; font-size: 15px; min-height: 22px; }
  .calc-out strong { font-weight: 800; }
  .hint-yes { color: var(--red-dark); font-weight: 700; }
  .hint-no { color: var(--grey-700); font-weight: 700; }

  /* result */
  .verdict { font-size: clamp(34px, 5vw, 56px); line-height: 1; letter-spacing: -.02em; font-weight: 500; margin: 0 0 10px; }
  .verdict.premium { color: var(--red); }
  .pkgs { font-size: 18px; margin: 0 0 6px; }
  .pkgs b { font-weight: 800; }
  .why { color: var(--grey-700); font-size: 17px; margin: 0 0 28px; max-width: 58ch; }
  .needs h2 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; font-weight: 500; }
  .needs .count { color: var(--grey-700); font-size: 15px; margin: 0 0 12px; }
  .group-title { font-size: 15px; font-weight: 600; margin: 18px 0 6px; color: var(--red); }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--grey-200); cursor: pointer; }
  .check:last-child { border-bottom: 1px solid var(--grey-200); }
  .check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--red); flex: none; cursor: pointer; }
  .check span { font-size: 17px; }
  .check input:checked + span { color: var(--grey-500); text-decoration: line-through; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
  .toast { font-size: 15px; font-weight: 600; color: var(--red-dark); align-self: center; min-height: 22px; }

  @media (max-width: 820px) {
    .wrap { padding: 24px 20px 48px; }
    .bar { padding: 12px 20px; }
    .grid { grid-template-columns: 1fr; gap: 28px; }
    .fields { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media print {
    .bar, .rail, .actions, .answers, .back-row { display: none; }
    .grid { display: block; }
  }

  /* inputs */
  .inp-row { display: flex; align-items: center; gap: 0; max-width: 360px; margin: 0 0 14px; }
  .inp-prefix { padding: 14px 14px; background: var(--grey-100); border: 1.5px solid var(--grey-200); border-right: 0; border-radius: 10px 0 0 10px; font-size: 22px; color: var(--grey-700); }
  .inp-big { flex: 1; min-width: 0; padding: 14px 16px; font-size: 22px; border: 1.5px solid var(--grey-700); border-radius: 10px; background: var(--white); }
  .inp-prefix + .inp-big { border-radius: 0 10px 10px 0; }
  select.inp-big { max-width: 360px; width: 100%; appearance: auto; }
  .live { min-height: 52px; margin: 0 0 18px; font-size: 16px; color: var(--grey-700); max-width: 56ch; }
  .live strong { color: var(--ink); font-weight: 700; }
  .err { color: var(--red-dark); font-weight: 600; margin: 0 0 16px; max-width: 56ch; }
  .btn[disabled] { opacity: .35; cursor: not-allowed; }
  .btn[disabled]:hover { background: var(--red); color: var(--white); }
  .btn.next { background: var(--red); border-color: var(--red); color: var(--white); }
  .btn.next:hover { background: var(--red-dark); border-color: var(--red-dark); }
  .node-sub { word-break: break-word; }
  .caveat { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--grey-200); font-size: 14px; font-weight: 700; color: var(--red); }
  .pkg-desc { font-size: 19px; max-width: 52ch; margin: 0 0 16px; color: var(--ink); }
  .reason { background: var(--grey-100); border-radius: 12px; padding: 14px 18px; margin: 0 0 26px; max-width: 58ch; font-size: 16px; }
</style>
</head>

<main class="wrap">
  <h1>Pick your package</h1>
  <p class="lede">Answer each step about the client's campaign. The tool will recommend if a premium package is necessary and lists requirements</p>

  <div class="grid">
    <ol class="rail" id="rail" aria-label="Your route so far"></ol>

  <footer class="caveat">Outcomes are not guaranteed and indicative only.</footer>

<script>
/* ==========================================================================
   EDIT HERE: thresholds, package names, objectives and partner requirements.
   ========================================================================== */
const CONFIG = {
  currency: "$",
  minBudget: 50000,          // step 1: budget must be at least this
  minCPC: 2,                 // step 3: cost per click must be at least this
  reachMax: 1000000,         // step 4: reach targets BELOW this are Premium
  cpm: 10,                   // step 6: assumed cost per 1,000 impressions
  engagementRateMin: 0.01,   // step 6: 1%
  roiMin: 2,                 // step 8: ROI of this or more is Headliner

  packages: {
    clicks: "Sound Check",
    reach: "Main Stage",
    engagement: "On Repeat",
    conversionHigh: "Headliner",
    conversionLow: "Line-up"
  },
  objectives: ["Clicks", "Reach", "Engagement", "Conversion", "Awareness"],

  // Description and "what you need from the client" for each package.
  // The keys must match the package names above ("Standard" is used for Standard).
  packageInfo: {
    "Standard": {
      description: "The client objective is compatible with the standard Live Nation Media Services protocol: brief using the traditional method to maximise profit.",
      needs: ["Dates", "Brief"]
    },
    "Sound Check": {
      description: "This package is the beginning of the lower funnel and is designed to maximise clicks.",
      needs: ["Budget confirmed", "Creative and copy"]
    },
    "Main Stage": {
      description: "This package will saturate data segments and proprietary users.",
      needs: ["Budget confirmed", "Creative and copy"]
    },
    "On Repeat": {
      description: "This package is designed to maximise engagement and should include an engagement product to enhance results.",
      needs: ["Budget confirmed", "Creative and copy", "Engagement product"]
    },
    "Headliner": {
      description: "This package is designed to maximise high value conversion, so tracking is crucial.",
      needs: ["Budget confirmed", "Creative and copy", "Conversion definition", "Tracking", "Creative guidelines", "Approved journey"]
    },
    "Line-up": {
      description: "This package is designed to maximise high value conversion, so creative and mechanic are crucial.",
      needs: ["Budget confirmed", "Creative and copy", "Conversion definition", "Tracking", "Engagement product", "Creative guidelines"]
    }
  }
};
/* ========================================================================== */

const C = CONFIG;
const money = n => C.currency + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
const fmt = n => Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
const pct = n => (n * 100).toLocaleString(undefined, { maximumFractionDigits: 2 }) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const parse = s => { const n = parseFloat(String(s).replace(/[^0-9.\-]/g, "")); return isNaN(n) ? null : n; };
const premium = (pkg, why) => ({ result: { type: "premium", pkg, why } });
const standard = why => ({ result: { type: "standard", pkg: null, why } });
const hint = (ok, text) => `<span class="${ok ? "hint-yes" : "hint-no"}">${text}</span>`;

/* ---------------- the flow: one entry per step ID ---------------- */
const NODES = {
  1: {
    label: "Client budget", kind: "number", prefix: C.currency,
    text: "What is the client's budget?",
    help: `The minimum is ${money(C.minBudget)}. Anything lower lands on Standard.`,
    summary: v => money(v),
    live: (vals, v) => v > 0 ? hint(v >= C.minBudget, `${money(v)} ${v >= C.minBudget ? "meets" : "is below"} the ${money(C.minBudget)} minimum.`) : "",
    evaluate: (vals, v) => v >= C.minBudget ? { next: 2 } : standard(`The budget of ${money(v)} is below the ${money(C.minBudget)} minimum.`)
  },
  2: {
    label: "Objective", kind: "select", options: C.objectives,
    text: "What is the client's main objective?",
    help: "This decides which outcome we measure.",
    summary: v => v,
    evaluate: (vals, v) => ({ Clicks: { next: 3 }, Reach: { next: 4 }, Engagement: { next: 5 }, Conversion: { next: 7 } }[v] || standard("Awareness campaigns are Standard."))
  },
  3: {
    label: "Clicks target", kind: "number",
    text: "How many clicks does the client want?",
    help: `Enter the target volume. The cost per click must be at least ${money(C.minCPC)}.`,
    summary: v => `${fmt(v)} clicks`,
    live: (vals, v) => v > 0 ? hint(vals[1] / v >= C.minCPC, `Cost per click would be <strong>${money(vals[1] / v)}</strong>. ${vals[1] / v >= C.minCPC ? "That meets the minimum." : `The most this budget supports is <strong>${fmt(Math.floor(vals[1] / C.minCPC))}</strong> clicks.`}`) : "",
    evaluate: (vals, v) => {
      const cpc = vals[1] / v;
      return cpc >= C.minCPC
        ? premium(C.packages.clicks, `Cost per click of ${money(cpc)} meets the ${money(C.minCPC)} minimum.`)
        : { error: `Cost per click would be ${money(cpc)}, and it must be at least ${money(C.minCPC)}. With a ${money(vals[1])} budget the most you can target is ${fmt(Math.floor(vals[1] / C.minCPC))} clicks. Lower the target to continue.` };
    }
  },
  4: {
    label: "Reach target", kind: "number",
    text: "How many people does the client want to reach?",
    help: `Reach targets under ${fmt(C.reachMax)} are Premium.`,
    summary: v => `${fmt(v)} people`,
    live: (vals, v) => v > 0 ? hint(v < C.reachMax, `${fmt(v)} is ${v < C.reachMax ? "under" : "at or above"} ${fmt(C.reachMax)}.`) : "",
    evaluate: (vals, v) => v < C.reachMax
      ? premium(C.packages.reach, `A reach target of ${fmt(v)} is under ${fmt(C.reachMax)}.`)
      : standard(`A reach target of ${fmt(v)} is ${fmt(C.reachMax)} or more.`)
  },
  5: {
    label: "Engagement product", kind: "yesno",
    text: "Is the client using the Engagement product?",
    help: "Premium engagement packages need the Engagement product.",
    summary: v => v ? "Yes" : "No",
    evaluate: (vals, v) => v ? { next: 6 } : standard("The client is not using the Engagement product.")
  },
  6: {
    label: "Engagement target", kind: "number",
    text: "What engagement volume is the client targeting?",
    help: `We turn the budget into impressions at a ${money(C.cpm)} CPM, then work out the engagement rate. ${pct(C.engagementRateMin)} or higher is Premium.`,
    summary: v => `${fmt(v)} engagements`,
    live: (vals, v) => {
      if (!(v > 0)) return "";
      const imp = vals[1] / C.cpm * 1000, rate = v / imp;
      return hint(rate >= C.engagementRateMin, `Impressions: <strong>${fmt(imp)}</strong>. Engagement rate: <strong>${pct(rate)}</strong>.`);
    },
    evaluate: (vals, v) => {
      const imp = vals[1] / C.cpm * 1000, rate = v / imp;
      const detail = `${fmt(v)} engagements on ${fmt(imp)} impressions is an engagement rate of ${pct(rate)}`;
      return rate >= C.engagementRateMin
        ? premium(C.packages.engagement, `${detail}, at or above ${pct(C.engagementRateMin)}.`)
        : standard(`${detail}, below ${pct(C.engagementRateMin)}.`);
    }
  },
  7: {
    label: "Conversion volume", kind: "number",
    text: "How many conversions does the client want?",
    help: "Enter the target volume of conversions.",
    summary: v => `${fmt(v)} conversions`,
    evaluate: () => ({ next: 8 })
  },
  8: {
    label: "Conversion value", kind: "number", prefix: C.currency,
    text: "What is the value of one conversion?",
    help: `ROI of ${fmt(C.roiMin)}x or more qualifies for ${C.packages.conversionHigh.toLowerCase()}`,
    summary: v => `${money(v)} each`,
    live: (vals, v) => {
      if (!(v > 0)) return "";
      const rev = v * vals[7], roi = rev / vals[1];
      return hint(roi >= C.roiMin, `Revenue: <strong>${money(rev)}</strong>. ROI: <strong>${fmt(roi)}x</strong>.`);
    },
    evaluate: (vals, v) => {
      const rev = v * vals[7], roi = rev / vals[1];
      const detail = `${fmt(vals[7])} conversions at ${money(v)} is ${money(rev)} of revenue on a ${money(vals[1])} budget, an ROI of ${fmt(roi)}x`;
      return roi >= C.roiMin
        ? premium(C.packages.conversionHigh, `${detail}, at or above ${fmt(C.roiMin)}x.`)
        : premium(C.packages.conversionLow, `${detail}, below ${fmt(C.roiMin)}x.`);
    }
  }
};

/* ---------------- state ---------------- */
const state = { path: [], vals: {}, current: 1, result: null, error: "", received: {} };
const rail = document.getElementById("rail");
const panel = document.getElementById("panel");

const infoFor = res => C.packageInfo[res.type === "premium" ? res.pkg : "Standard"];
function needsFor(res) {
  return [{ title: "", items: infoFor(res).needs }];
}
const allNeeds = res => needsFor(res).flatMap(g => g.items);

/* ---------------- rail: the route actually taken ---------------- */
function renderRail() {
  let html = "";
  state.path.forEach((id, i) => {
    const n = NODES[id];
    html += `<li class="node yes passed">
      <div class="dot" aria-hidden="true">&#10003;</div>
      <div class="node-body">
        <button class="node-btn" data-edit="${i}" aria-label="${esc(n.label)}: ${esc(n.summary(state.vals[id]))}. Change answer">${esc(n.label)}</button>
        <span class="node-sub">${esc(n.summary(state.vals[id]))}</span>
      </div></li>`;
  });
  if (state.current !== null) {
    const n = NODES[state.current];
    html += `<li class="node current">
      <div class="dot" aria-hidden="true">${state.path.length + 1}</div>
      <div class="node-body"><span class="node-btn" style="cursor:default">${esc(n.label)}</span><span class="node-sub">Answering now</span></div></li>`;
  }
  const r = state.result;
  html += `<li class="node ${r ? (r.type === "premium" ? "result-premium" : "result-standard") : ""}">
    <div class="dot" aria-hidden="true">${r ? (r.type === "premium" ? "&#9733;" : "&#9679;") : "&#9679;"}</div>
    <div class="node-body">
      <span class="node-btn" style="cursor:default">${r ? esc(r.type === "premium" ? "Premium: " + r.pkg : "Standard package") : "Result"}</span>
      <span class="node-sub">${r ? "Your result" : "Depends on your answers"}</span>
    </div></li>`;
  rail.innerHTML = html;
}

/* ---------------- question panel ---------------- */
function renderQuestion() {
  const id = state.current, n = NODES[id], v = state.vals[id];
  const stepNo = state.path.length + 1;
  let input = "";
  if (n.kind === "number") {
    input = `<div class="inp-row">${n.prefix ? `<span class="inp-prefix">${esc(n.prefix)}</span>` : ""}<input class="inp-big" id="inp" inputmode="decimal" autocomplete="off" aria-label="${esc(n.text)}" value="${v !== undefined && v !== null ? esc(fmt(v)) : ""}"></div>
      <div class="live" id="live">${v > 0 && n.live ? n.live(state.vals, v) : ""}</div>`;
  } else if (n.kind === "select") {
    input = `<div class="inp-row"><select class="inp-big" id="inp" aria-label="${esc(n.text)}"><option value="">Choose one</option>${n.options.map(o => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
  }
  const actions = n.kind === "yesno"
    ? `<div class="answers"><button class="btn yes" data-yn="yes">Yes</button><button class="btn" data-yn="no">No</button></div>`
    : `<div class="answers"><button class="btn next" id="next" data-next="1" ${v === undefined || v === null || v === "" ? "disabled" : ""}>Next</button></div>`;
  panel.innerHTML = `
    <p class="step-meta">Step ${stepNo}: ${esc(n.label)}</p>
    <h2 class="q" tabindex="-1" id="q-heading">${esc(n.text)}</h2>
    <p class="help">${esc(n.help || "")}</p>
    ${input}
    ${state.error ? `<p class="err" role="alert">${esc(state.error)}</p>` : ""}
    ${actions}
    ${state.path.length ? `<div class="back-row"><button class="btn ghost" data-back="1">Back</button></div>` : ""}`;
}

/* ---------------- result panel ---------------- */
function renderResult() {
  const r = state.result, isP = r.type === "premium";
  const items = allNeeds(r), got = items.filter(t => state.received[t]).length;
  const groups = needsFor(r).map(g => `
    ${g.items.map(t => `<label class="check"><input type="checkbox" data-need="${esc(t)}" ${state.received[t] ? "checked" : ""}><span>${esc(t)}</span></label>`).join("")}`).join("");
  panel.innerHTML = `
    <p class="step-meta">Result</p>
    <h2 class="verdict ${isP ? "premium" : ""}" tabindex="-1" id="q-heading">${isP ? "Premium: " + esc(r.pkg) : "Standard package"}</h2>
    <p class="pkg-desc">${esc(infoFor(r).description)}</p>
    <div class="reason"><strong>Why this result:</strong> ${esc(r.why)}</div>
    <div class="needs">
      <h2>What you need from the client</h2>
      <p class="count" id="need-count">${got} of ${items.length} received</p>
      ${groups}
    </div>
    <div class="actions">
      <button class="btn yes" data-copy="1">Copy summary</button>
      <button class="btn" data-restart="1">Start again</button>
      <button class="btn ghost" data-back="1">Back</button>
      <span class="toast" id="toast" role="status"></span>
    </div>`;
}

function summaryText() {
  const r = state.result, L = [];
  L.push(`Result: ${r.type === "premium" ? "Premium: " + r.pkg : "Standard package"}`);
  L.push(infoFor(r).description, `Why: ${r.why}`, "", "Answers:");
  state.path.forEach(id => L.push(`- ${NODES[id].label}: ${NODES[id].summary(state.vals[id])}`));
  L.push("", "Needed from the client:");
  allNeeds(r).forEach(t => L.push(`[${state.received[t] ? "x" : " "}] ${t}`));
  return L.join("\n");
}

/* ---------------- engine ---------------- */
function render(focus) {
  renderRail();
  state.result ? renderResult() : renderQuestion();
  if (focus) {
    const f = document.getElementById("inp") || document.getElementById("q-heading");
    if (f) f.focus({ preventScroll: true });
  }
}
function submit() {
  const id = state.current, n = NODES[id], v = state.vals[id];
  if (v === undefined || v === null || v === "" || (n.kind === "number" && !(v > 0))) return;
  const out = n.evaluate(state.vals, v);
  if (out.error) { state.error = out.error; render(false); const e = document.getElementById("inp"); if (e) e.focus(); return; }
  state.error = "";
  state.path.push(id);
  if (out.result) { state.result = out.result; state.current = null; }
  else state.current = out.next;
  render(true);
}
function goBack() {
  state.error = "";
  if (state.result) { state.result = null; state.current = state.path.pop(); }
  else if (state.path.length) state.current = state.path.pop();
  render(true);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.next) submit();
  else if (t.dataset.yn) { state.vals[state.current] = t.dataset.yn === "yes"; submit(); }
  else if (t.dataset.back) goBack();
  else if (t.dataset.edit !== undefined) {
    const i = Number(t.dataset.edit);
    state.current = state.path[i]; state.path = state.path.slice(0, i); state.result = null; state.error = ""; render(true);
  }
  else if (t.dataset.restart) { Object.assign(state, { path: [], vals: {}, current: 1, result: null, error: "", received: {} }); render(true); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (t.dataset.copy) {
    const text = summaryText();
    const done = () => { const el = document.getElementById("toast"); if (el) el.textContent = "Summary copied"; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  }
});
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (_) { const el = document.getElementById("toast"); if (el) el.textContent = "Copy failed. Select the list and copy it manually."; }
  document.body.removeChild(ta);
}
document.addEventListener("input", e => {
  if (e.target.id !== "inp" || state.current === null) return;
  const n = NODES[state.current];
  const v = n.kind === "number" ? parse(e.target.value) : e.target.value;
  state.vals[state.current] = v; state.error = "";
  const live = document.getElementById("live"); if (live) live.innerHTML = v > 0 && n.live ? n.live(state.vals, v) : "";
  const nx = document.getElementById("next"); if (nx) nx.disabled = (n.kind === "number") ? !(v > 0) : !v;
  const err = panel.querySelector(".err"); if (err) err.remove();
});
document.addEventListener("change", e => {
  if (e.target.id === "inp" && e.target.tagName === "SELECT") {
    state.vals[state.current] = e.target.value; const nx = document.getElementById("next"); if (nx) nx.disabled = !e.target.value;
  }
  const n = e.target.dataset && e.target.dataset.need;
  if (n !== undefined && n !== "" && state.result) {
    state.received[n] = e.target.checked;
    const items = allNeeds(state.result), el = document.getElementById("need-count");
    if (el) el.textContent = `${items.filter(t => state.received[t]).length} of ${items.length} received`;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "inp") { e.preventDefault(); submit(); }
});

render(false);
</script>
</body>
</html>
